<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1f16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Diario de jardinería</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
/* ─────────────────────────────────────────────────────────────
   TOKENS
   ───────────────────────────────────────────────────────────── */
:root{
  --fondo:#1a1f16;
  --superficie:#232a1e;
  --superficie-alta:#2c3527;
  --borde:#3a4530;
  --texto:#e9ecdd;
  --tenue:#98a289;
  --savia:#9bbd5a;
  --agua:#6fb3c9;
  --seco:#d9a441;
  --alarma:#c4643c;
  --tierra:#c08457;
  --flor:#cf8fb4;
  --fruto:#e07a45;
  --r:10px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--fondo);color:var(--texto);font-family:var(--sans);
  font-size:16px;line-height:1.4;overscroll-behavior-y:contain;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
body.con-accion{padding-bottom:calc(var(--nav-h) + 72px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:1.4rem}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--tenue);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--savia);outline-offset:2px}

/* ── LAYOUT ── */
header.app{
  position:sticky;top:0;z-index:20;background:rgba(26,31,22,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--borde);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;
  display:flex;align-items:center;gap:12px;
}
header.app .crece{flex:1;min-width:0}
.fecha-cab{width:auto;max-width:42%;min-height:38px;padding:6px 8px;font-size:.85rem}
.fecha-cab.retro{border-color:var(--seco);color:var(--seco)}
main{padding:14px 16px 24px;max-width:640px;margin:0 auto}
section.bloque{margin-bottom:22px}
section.bloque h2{margin-bottom:8px}
.pie{color:var(--tenue);font-size:.82rem}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--superficie);border-top:1px solid var(--borde);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs a{
  flex:1;height:var(--nav-h);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--tenue);font-size:.7rem;letter-spacing:.04em;
}
nav.tabs a.on{color:var(--savia)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ── CONTROLES ── */
.btn{
  border:1px solid var(--borde);background:var(--superficie);color:var(--texto);
  border-radius:var(--r);padding:11px 14px;font-size:.95rem;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn.principal{background:var(--savia);color:#12180f;border-color:var(--savia);font-weight:600}
.btn.agua{background:var(--agua);color:#0e1d22;border-color:var(--agua);font-weight:600}
.btn.peligro{color:var(--alarma);border-color:#4a3126}
.btn.fantasma{background:transparent}
.btn.ancho{width:100%}
.btn:disabled{opacity:.45}
.fila-btns{display:flex;gap:8px;flex-wrap:wrap}
.fila-btns>.btn{flex:1 1 auto}

input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--superficie);border:1px solid var(--borde);
  border-radius:var(--r);padding:11px 12px;min-height:44px;
}
textarea{min-height:80px;resize:vertical}
label.campo{display:block;margin-bottom:12px}
label.campo>span{display:block;font-size:.78rem;color:var(--tenue);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.08em}
label.check{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:44px}
label.check input{width:22px;height:22px;accent-color:var(--savia)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--borde);background:var(--superficie);border-radius:999px;
  padding:8px 13px;font-size:.85rem;min-height:38px}
.chip.on{background:var(--savia);color:#12180f;border-color:var(--savia)}

/* ── FILAS DE PLANTA ── */
.lista{display:flex;flex-direction:column;gap:8px}
.fila{
  display:flex;align-items:stretch;gap:0;background:var(--superficie);
  border:1px solid var(--borde);border-radius:var(--r);overflow:hidden;
}
.fila.sel{border-color:var(--agua);background:var(--superficie-alta)}
.fila .toggle{
  flex:1;display:flex;align-items:center;gap:12px;padding:12px;
  background:none;border:0;text-align:left;min-height:64px;
}
.marca{
  flex:0 0 24px;height:24px;border-radius:7px;border:2px solid var(--borde);
  display:grid;place-items:center;color:#12180f;
}
.fila.sel .marca{background:var(--agua);border-color:var(--agua)}
.marca svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
.fila.sel .marca svg{visibility:visible}
.cuerpo{flex:1;min-width:0;display:block}
.nombre{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:block;font-size:.78rem;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Signature: la barra de reserva. Centro = 0 días. */
.reserva{display:block;position:relative;height:6px;margin-top:8px;background:#1c2318;border-radius:3px}
.reserva::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--borde)}
.reserva i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--savia)}
.reserva i.deuda{background:var(--alarma)}
.reserva i.justo{background:var(--seco)}

.dias{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:0 12px;min-width:62px;font-family:var(--mono)}
.dias b{font-size:1.35rem;font-weight:600;line-height:1}
.dias small{font-size:.62rem;color:var(--tenue);letter-spacing:.08em;text-transform:uppercase}
.dias.deuda b{color:var(--alarma)}
.dias.justo b{color:var(--seco)}
.dias.bien b{color:var(--savia)}
.abrir{flex:0 0 46px;border:0;border-left:1px solid var(--borde);background:transparent;
  color:var(--tenue);font-size:1.2rem}

/* ── BARRA DE ACCIÓN ── */
.accion{
  position:fixed;left:0;right:0;z-index:25;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding:10px 16px;background:rgba(26,31,22,.96);border-top:1px solid var(--borde);
  display:flex;gap:8px;
}
.accion .btn{flex:1}

/* ── AVISOS / TOAST ── */
.aviso{
  border:1px solid var(--borde);border-left:3px solid var(--seco);
  background:var(--superficie);border-radius:var(--r);padding:12px;margin-bottom:16px;
  display:flex;gap:12px;align-items:center;font-size:.9rem;
}
.aviso .btn{padding:8px 12px;min-height:38px}
.toast{
  position:fixed;left:12px;right:12px;z-index:40;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
  background:var(--superficie-alta);border:1px solid var(--borde);border-radius:var(--r);
  padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);
}
.toast p{margin:0 0 10px}

/* ── MODAL ── */
.velo{position:fixed;inset:0;z-index:50;background:rgba(10,13,8,.72);
  display:flex;align-items:flex-end;justify-content:center}
.hoja{
  width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--fondo);
  border:1px solid var(--borde);border-radius:16px 16px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));
}
.hoja h3{margin-bottom:14px;font-size:1.1rem}

/* ── PLEGABLES Y GRUPOS DE TEMPORADA ── */
.plegable{
  width:100%;display:flex;align-items:center;gap:10px;min-height:48px;
  background:var(--superficie);border:1px solid var(--borde);border-radius:var(--r);
  padding:10px 14px;text-align:left;color:var(--tenue);
  font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;font-weight:600;
}
.plegable .crece{flex:1}
.plegable .pie{text-transform:none;letter-spacing:0}
.flecha{transition:transform .15s ease}
.flecha.abierta{transform:rotate(180deg)}
.grupo{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--r);overflow:hidden}
.grupo.apagado{opacity:.55}
.grupo-cab{width:100%;display:flex;align-items:center;gap:10px;min-height:60px;
  padding:10px 14px;background:none;border:0;text-align:left;color:var(--texto)}
.grupo-cab .crece{flex:1;min-width:0}
.grupo-cab .flecha{color:var(--tenue)}
.grupo-cuerpo{padding:0 14px 14px;border-top:1px solid var(--borde)}
.punto{width:10px;height:10px;border-radius:50%;flex:0 0 10px}

/* ── BANDA ANUAL ── */
.banda{padding:12px 10px}
.banda-meses,.banda-fila{display:flex;align-items:center;gap:8px}
.banda-meses{margin:0 0 6px;color:var(--tenue);font-size:.68rem;font-family:var(--mono)}
.banda-meses b{flex:1;text-align:center;font-weight:400}
.banda-meses b.mes-hoy{color:var(--texto);font-weight:700}
.banda-fila{margin-bottom:5px}
.banda-et{flex:0 0 86px;font-size:.68rem;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banda-celdas{flex:1;display:flex;gap:1px}
.banda-celdas i{flex:1;height:12px;background:#1c2318;border-radius:2px}
.banda-celdas i.ahora{box-shadow:inset 0 0 0 1px var(--texto)}

/* ── AGENDA ── */
.dia{margin-bottom:14px}
.dia-cab{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;
  padding:6px 2px;color:var(--tenue);font-size:.8rem;text-align:left}
.dia-cab .crece{flex:1}
.dia-cab .mas{font-size:1.2rem;color:var(--savia)}
.hueco{display:block;width:100%;background:none;border:0;border-top:1px dashed var(--borde);
  color:var(--tenue);font-size:.75rem;padding:10px 0;margin:6px 0}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rejilla .btn{width:100%}

/* ── HISTÓRICO ── */
.evento{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--borde)}
.evento:last-child{border-bottom:0}
.evento .tipo{flex:0 0 76px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--tenue);padding-top:3px}
.evento .txt{flex:1;min-width:0}
.evento .galeria{margin-top:6px}
.evento .fecha{font-family:var(--mono);font-size:.78rem;color:var(--tenue)}
.evento .quitar{background:none;border:0;color:var(--tenue);padding:4px 8px;min-width:34px}
.evento .quitar svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.t-riego{color:var(--agua)}
.t-lluvia{color:var(--agua)}
.t-baja{color:var(--alarma)}
.t-observacion{color:var(--seco)}
.t-tratamiento{color:var(--agua)}
.t-cosecha{color:var(--savia)}
.vacio{color:var(--tenue);font-size:.9rem;padding:18px 0;text-align:center}
.tarjeta{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--r);padding:14px}
.dato{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:.9rem;
  border-bottom:1px solid rgba(58,69,48,.5)}
.dato:last-child{border-bottom:0}
.dato span:first-child{color:var(--tenue)}
.grande{font-family:var(--mono);font-size:2.6rem;line-height:1;font-weight:600}

/* ── FASE 3: fotos, curva y sanidad ── */
.galeria{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.foto{position:relative;width:104px;height:104px;padding:0;border:1px solid var(--borde);
  border-radius:var(--r);overflow:hidden;background:var(--superficie)}
.foto img{width:100%;height:100%;object-fit:cover;display:block;background:var(--superficie-alta)}
.foto .foto-fecha{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:.68rem;
  background:rgba(10,13,8,.72);color:var(--texto);text-align:left}
.foto-rota{width:104px;height:104px;display:grid;place-items:center;color:var(--tenue);
  font-size:.72rem;border:1px dashed var(--borde);border-radius:var(--r)}
.visor{background:#12160f;border:1px solid var(--borde);border-radius:var(--r);overflow:hidden}
.visor img{width:100%;display:block}
.curva{width:100%;height:auto;display:block}
.aviso.rojo{border-left-color:var(--alarma)}
.lista-agentes{display:flex;flex-wrap:wrap;gap:8px;max-height:46vh;overflow:auto;padding:2px}
.chip.agente{text-align:left}
.chip small{color:var(--tenue)}
.sev-1{background:#3a4530}
.sev-2{background:var(--seco);color:#1b1607;border-color:var(--seco);font-weight:600}
.sev-3{background:var(--alarma);color:#1b0f09;border-color:var(--alarma);font-weight:600}
.evento .quitar svg{width:16px;height:16px}
@media (prefers-reduced-motion:no-preference){
  .fila,.chip,.btn{transition:background-color .12s ease,border-color .12s ease}
}
</style>
</head>
<body>

<header class="app" id="cabecera"></header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div id="capas"></div>

<script src="./app.js" defer></script>

</body>
</html>
